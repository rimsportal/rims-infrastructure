name: Terraform Pre-checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "foundation/**"
      - ".github/workflows/pre-checks.yml"


permissions:
  contents: read

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: terraform -chdir=foundation fmt -check -recursive

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - name: Initialize and run TFLint
        working-directory: foundation
        # tflint >= 0.47 no longer accepts a positional path; run from the dir
        # and let --recursive walk the modules/environments. Warnings (e.g. a
        # module without its own required_providers) don't fail the build.
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

  kics-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run KICS scan
        uses: checkmarx/kics-github-action@v2
        # Informational for now: report findings but don't block the PR.
        # Tighten later by removing this and addressing/excluding queries.
        continue-on-error: true
        with:
          path: foundation
          output_path: results
          output_formats: sarif
