name: Terraform Apply

# Manual only. Apply never runs on push/merge — you dispatch it explicitly and
# choose the environment. The job binds to that GitHub environment, so it PAUSES
# for approval (if the environment has a required reviewer) before applying.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project directory name (DesignsTool)"
        required: true
        default: "DesignsTool"
        type: string
      environment:
        description: "Environment directory name (dev, qa)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa

permissions:
  id-token: write # required for Azure OIDC login
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    # Approval gate: this environment must have "Required reviewers" configured.
    environment: ${{ inputs.environment || 'dev' }}
    concurrency: terraform-${{ inputs.project || 'DesignsTool' }}-${{ inputs.environment || 'dev' }}
    env:
      TF_IN_AUTOMATION: "true"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      PROJECT: ${{ inputs.project || 'DesignsTool' }}
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # Mint a short-lived token from the GitHub App so `terraform init` can clone
      # the private rims-infra-core-modules repo over HTTPS.
      - name: Mint module-repo token
        id: modtoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MODULES_APP_ID }}
          private-key: ${{ secrets.MODULES_APP_PRIVATE_KEY }}
          owner: rimsportal
          repositories: rims-infra-core-modules
      - name: Authenticate to private module repo
        run: git config --global url."https://x-access-token:${{ steps.modtoken.outputs.token }}@github.com/".insteadOf "https://github.com/"
      - name: Terraform init, plan, and apply
        working-directory: foundation/deployments/projects/${{ env.PROJECT }}/${{ env.ENVIRONMENT }}
        run: |
          n=0; until terraform init -input=false; do
            n=$((n+1)); if [ "$n" -ge 3 ]; then echo "init failed after $n attempts"; exit 1; fi
            echo "init attempt $n failed; retrying in 15s..."; sleep 15
          done
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
