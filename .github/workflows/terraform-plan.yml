name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project directory name (DesignsTool or shared)"
        required: true
        default: "DesignsTool"
        type: string
      environment:
        description: "Environment directory name (dev, qa, dev-hub, qa-hub)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - dev-hub
          - qa-hub

permissions:
  id-token: write # required for Azure OIDC login
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # Mint a short-lived token from the GitHub App so `terraform init` can clone
      # the private rims-infra-core-modules repo over HTTPS.
      - name: Mint module-repo token
        id: modtoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MODULES_APP_ID }}
          private-key: ${{ secrets.MODULES_APP_PRIVATE_KEY }}
          owner: rimsportal
          repositories: rims-infra-core-modules
      - name: Authenticate to private module repo
        run: git config --global url."https://x-access-token:${{ steps.modtoken.outputs.token }}@github.com/".insteadOf "https://github.com/"
      # On a PR: plan BOTH dev and qa (their configs differ, so validate each).
      # On manual dispatch: plan only the chosen environment.
      - name: Terraform init, validate, and plan
        shell: bash
        env:
          PROJECT: ${{ inputs.project || 'DesignsTool' }}
          DISPATCH_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            envs="$DISPATCH_ENV"
          else
            envs="dev qa"
          fi
          for e in $envs; do
            if [ "$PROJECT" = "shared" ]; then
              dir="foundation/deployments/shared/$e"
            else
              dir="foundation/deployments/projects/$PROJECT/$e"
            fi
            echo "::group::plan $e"
            n=0; until terraform -chdir="$dir" init -input=false; do
              n=$((n+1)); if [ "$n" -ge 3 ]; then echo "init failed after $n attempts"; exit 1; fi
              echo "init attempt $n failed; retrying in 15s..."; sleep 15
            done
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" plan -input=false
            echo "::endgroup::"
          done
