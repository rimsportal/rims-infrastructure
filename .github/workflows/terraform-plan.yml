name: Terraform Plan

on:
  pull_request:
    paths:
      - "foundation/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:
    inputs:
      project:
        description: "Project directory name (DesignsTool)"
        required: true
        default: "DesignsTool"
        type: string
      environment:
        description: "Environment directory name (dev, qa, preprod, prod)"
        required: true
        default: "dev"
        type: string

permissions:
  id-token: write # required for Azure OIDC login
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init, validate, and plan
        working-directory: foundation/deployments/projects/${{ inputs.project || 'DesignsTool' }}/${{ inputs.environment || 'dev' }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -input=false
