name: Terraform Plan

on:
  pull_request:
    paths:
      - "foundation/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:
    inputs:
      project:
        description: "Project directory name (DesignsTool)"
        required: true
        default: "DesignsTool"
        type: string
      environment:
        description: "Environment directory name (dev, prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write # required for Azure OIDC login
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # On a PR: plan BOTH dev and prod (their configs differ, so validate each).
      # On manual dispatch: plan only the chosen environment.
      - name: Terraform init, validate, and plan
        shell: bash
        env:
          PROJECT: ${{ inputs.project || 'DesignsTool' }}
          DISPATCH_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            envs="$DISPATCH_ENV"
          else
            envs="dev prod"
          fi
          for e in $envs; do
            dir="foundation/deployments/projects/$PROJECT/$e"
            echo "::group::plan $e"
            terraform -chdir="$dir" init -input=false
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" plan -input=false
            echo "::endgroup::"
          done
